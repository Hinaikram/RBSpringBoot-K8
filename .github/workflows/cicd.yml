name: Build and Deploy Spring Boot App to EKS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Clear Stale State
      run: rm -f terraform.tfstate terraform.tfstate.backup
      working-directory: ./terraform
      continue-on-error: true

    - name: Terraform Init
      run: terraform init
      working-directory: ./terraform

    - name: Terraform Plan
      run: terraform plan -out=tfplan
      working-directory: ./terraform

    - name: Terraform Apply
      run: terraform apply -auto-approve tfplan
      working-directory: ./terraform

    - name: Export Terraform Outputs
      id: terraform_outputs
      run: |
        ECR_URL=$(terraform output -raw ecr_repository_url)
        echo "ECR_URL=$ECR_URL"
        echo "ECR_URL=$ECR_URL" >> $GITHUB_ENV
        CLUSTER_NAME=$(terraform output -raw cluster_name)
        echo "CLUSTER_NAME=$CLUSTER_NAME"
        echo "CLUSTER_NAME=$CLUSTER_NAME" >> $GITHUB_ENV
      working-directory: ./terraform

  build:
    runs-on: ubuntu-latest
    needs: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Run Tests
      run: mvn test --no-transfer-progress

    - name: Build with Maven
      run: mvn clean install --no-transfer-progress

    - name: Build Docker image
      run: docker build -t springboot-app .

    - name: Log in to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Tag Docker image
      run: |
        docker tag springboot-app:latest 715841370482.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/rb-ecr:${{ github.sha }}
        docker tag springboot-app:latest 715841370482.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/rb-ecr:latest

    - name: Push Docker image to ECR
      run: |
        docker push 715841370482.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/rb-ecr:${{ github.sha }}
        docker push 715841370482.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/rb-ecr:latest

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: springboot-app
        path: target/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Configure kubectl
      run: |
        aws eks --region ${{ secrets.AWS_REGION }} update-kubeconfig --name RB-eks-cluster

    - name: Deploy Kubernetes Manifests
      run: |
        kubectl apply -f kubernetes/deployment.yaml --namespace default
        kubectl apply -f kubernetes/service.yaml --namespace default

    - name: Update Deployment Image and Restart
      run: |
        kubectl set image deployment/springboot-app springboot-app=715841370482.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/rb-ecr:${{ github.sha }} --namespace default
        kubectl rollout restart deployment/springboot-app --namespace default

    - name: Check Deployment Status
      run: |
        kubectl rollout status deployment/springboot-app --namespace default --timeout=300s

  destroy:
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
    - name: Sleep for 5 minutes before destroying infra
      run: sleep 300

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Terraform Init
      run: terraform init
      working-directory: ./terraform

    - name: Terraform Destroy
      run: terraform destroy -auto-approve
      working-directory: ./terraform
