name: Terraform CI/CD for EKS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  terraform:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform  # update if your terraform code is elsewhere

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check existing KMS alias and CloudWatch log group
        run: |
          echo "Checking for KMS alias..."
          aws kms list-aliases --query "Aliases[?AliasName=='alias/eks/RB-eks-cluster']" | grep -q "alias/eks/RB-eks-cluster" \
            && echo "KMS alias already exists." || echo "KMS alias does not exist."

          echo "Checking for CloudWatch log group..."
          aws logs describe-log-groups --log-group-name-prefix "/aws/eks/RB-eks-cluster/cluster" \
            --query "logGroups[?logGroupName=='/aws/eks/RB-eks-cluster/cluster']" | grep -q "/aws/eks/RB-eks-cluster/cluster" \
            && echo "CloudWatch log group already exists." || echo "Log group does not exist."

      - name: Terraform Init
        run: terraform init

      # Terraform Plan step
      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ./terraform

      # Terraform Apply step
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ./terraform

      - name: Export Terraform Outputs
        id: tf_outputs
        run: |
          echo "ECR_URL=$(terraform output -raw ecr_repository_url)" >> $GITHUB_ENV
          echo "CLUSTER_NAME=$(terraform output -raw cluster_name)" >> $GITHUB_ENV
        working-directory: ./terraform

  build:
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Tests
        run: mvn test --no-transfer-progress

      - name: Build with Maven
        run: mvn clean install --no-transfer-progress

      - name: Build Docker image
        run: docker build -t springboot-app .

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Tag Docker image
        run: |
          docker tag springboot-app:latest $ECR_URL:${{ github.sha }}
          docker tag springboot-app:latest $ECR_URL:latest

      - name: Push Docker image to ECR
        run: |
          docker push $ECR_URL:${{ github.sha }}
          docker push $ECR_URL:latest

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-app
          path: target/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks --region $AWS_REGION update-kubeconfig --name $CLUSTER_NAME

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -f kubernetes/deployment.yaml --namespace default
          kubectl apply -f kubernetes/service.yaml --namespace default

      - name: Update Deployment Image and Restart
        run: |
          kubectl set image deployment/springboot-app springboot-app=$ECR_URL:${{ github.sha }} --namespace default
          kubectl rollout restart deployment/springboot-app --namespace default

      - name: Check Deployment Status
        run: |
          kubectl rollout status deployment/springboot-app --namespace default --timeout=300s
